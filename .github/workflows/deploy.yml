name: Deploy to Cloudflare

on:
  push:
    branches: [main, claude/eager-lamport-fekefi]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONNECTOR_SECRET: ${{ secrets.CONNECTOR_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

      - name: Check secrets
        run: |
          # Strip whitespace that easily sneaks in when pasting the secret into GitHub.
          CONNECTOR_SECRET=$(printf '%s' "$CONNECTOR_SECRET" | tr -d '[:space:]')
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CONNECTOR_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::GitHub secret $v fehlt"; exit 1; fi
          done
          if [ ${#CONNECTOR_SECRET} -lt 24 ]; then echo "::error::CONNECTOR_SECRET muss mindestens 24 Zeichen haben"; exit 1; fi
          # Pasted Cloudflare values sometimes carry extra lines; keep the first non-empty line only.
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            clean=$(printf '%s\n' "${!v}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -m1 .)
            if [ "$clean" != "${!v}" ]; then echo "::warning::GitHub secret $v enthielt Leerzeichen oder mehrere Zeilen, nur die erste Zeile wird verwendet"; fi
            echo "::add-mask::$clean"
            echo "$v=$clean" >> "$GITHUB_ENV"
          done

      - run: npx wrangler deploy
      - run: printf '%s' "$CONNECTOR_SECRET" | tr -d '[:space:]' | npx wrangler secret put CONNECTOR_SECRET
